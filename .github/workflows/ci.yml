name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known high/critical vulnerabilities in runtime dependencies fail the build (#397).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      # Sandbox egress firewall (#399): the same script as on the server, so the integration test can prove that
      # installs reach a registry but not the metadata service, the LAN or the host.
      - name: Sandbox egress network
        run: sudo SANDBOX_EGRESS_MARKER="$RUNNER_TEMP/sandbox-egress-firewall" bash deploy/hetzner/sandbox-network.sh
      - run: pnpm test
        env:
          SANDBOX_EGRESS_TEST: "1"
          SANDBOX_EGRESS_MARKER: ${{ runner.temp }}/sandbox-egress-firewall
      - name: Rollback guard tests
        run: bash deploy/hetzner/rollback-guard.test.sh
      - name: Post-restore scrub tests (ADR 0206)
        run: bash deploy/hetzner/post-restore-scrub.test.sh
      - name: Off-site backup tests (#526)
        run: bash deploy/hetzner/backup-offsite.test.sh
      - name: Check that migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle || (echo "Schema changed without a committed migration. Run pnpm db:generate." && exit 1)
      - run: pnpm build
      - name: No engine logic in the browser bundle (#189)
        run: node scripts/check-client-bundle.mjs

  # Auth regression in a real browser (live bug 08.11.26): sign-up, verification link, sign-in, sign-out, a second
  # account in the same browser and password reset against the production build, PostgreSQL and a local test mail server.
  e2e-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: consyrium_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:e2e@127.0.0.1:5432/consyrium_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm --filter @consyrium/web exec playwright install --with-deps chromium
      - run: pnpm --filter @consyrium/web e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-auth-traces
          path: apps/web/test-results/
          retention-days: 7

  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter consyrium package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consyrium-vsix
          path: apps/vscode/dist/consyrium.vsix

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build web image
        run: docker build -f Dockerfile.web -t consyrion-web .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t consyrion-worker .
      - name: Smoke test web image (health endpoint answers, DB unreachable → 503)
        run: |
          docker run -d --name web -p 3000:3000 -e DATABASE_URL=postgres://nobody:none@127.0.0.1:1/none -e BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-1234 -e BETTER_AUTH_URL=http://localhost:3000 consyrion-web
          for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true); [ "$code" = "503" ] && break; sleep 2; done
          docker logs web | tail -20
          test "$code" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/sign-in)" = "200"
